<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicants — SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="applicants" data-role="employer">

  <header id="topbar"></header>

  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main-area"><div class="page-wrap">

      <div class="row-between">
        <h1 class="page-title">Applicants</h1>
        <select id="applicant-job-filter"><!-- filled by applications.js --></select>
      </div>
      <p class="muted">Change an applicant's status to move them through your hiring process.
        They get notified automatically.</p>
      <div class="alert alert-info small-text mt-1">
        Status guide: <span class="badge badge-pending">Pending</span> waiting ·
        <span class="badge badge-reviewed">Reviewed</span> seen it ·
        <span class="badge badge-shortlisted">Shortlisted</span> strong candidate ·
        <span class="badge badge-accepted">Accepted</span> hired 🎉 ·
        <span class="badge badge-rejected">Rejected</span> not chosen
      </div>

      <div id="applicants-list" class="mt-2"></div>

    </div></main>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/applications.js"></script>
  <script src="../../assets/js/jobs.js"></script>
  <script src="../../assets/js/recommendations.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => Applications.renderApplicantsPage());
  </script>
</body>
</html>
