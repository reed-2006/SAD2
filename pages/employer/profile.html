<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Profile — SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="company-profile" data-role="employer">

  <header id="topbar"></header>

  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main-area"><div class="page-wrap">

      <h1 class="page-title">Company Profile</h1>
      <p class="muted">This information appears on your job postings and helps admins verify your business.</p>

      <div class="card mt-2" style="padding:14px 16px">
        <span id="verification-badge"><!-- filled by profile.js --></span>
      </div>

      <form id="employer-profile-form" class="card mt-2" novalidate>
        <h3><i class="fa-solid fa-building"></i> Business Information</h3>
        <div class="form-grid-2 mt-1">
          <div class="form-group">
            <label>Business / Company Name *</label>
            <input type="text" id="e-company" placeholder="e.g. Demo Local Restaurant">
          </div>
          <div class="form-group">
            <label>Contact Number</label>
            <input type="tel" id="e-contact" placeholder="032-XXX-XXXX or 09XXXXXXXXX">
          </div>
        </div>

        <div class="form-group">
          <label>About the Business</label>
          <textarea id="e-desc" rows="4"
            placeholder="What does your business do? How many staff? What's the work environment like?"></textarea>
        </div>

        <h3 class="mt-2"><i class="fa-solid fa-location-dot"></i> Address</h3>
        <div class="form-grid-2 mt-1">
          <div class="form-group">
            <label>Street / Building Address</label>
            <input type="text" id="e-address" placeholder="e.g. 123 National Highway">
          </div>
          <div class="form-group">
            <label>Barangay</label>
            <input type="text" id="e-barangay" list="brgy-list" placeholder="e.g. Poblacion">
            <datalist id="brgy-list">
              <option>Poblacion</option><option>Bato</option><option>Talavera</option>
              <option>Sangi</option><option>Dumlog</option><option>Awihao</option><option>Sam-ang</option>
            </datalist>
          </div>
          <div class="form-group">
            <label>City / Municipality</label>
            <input type="text" id="e-city">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg mt-2">
          <i class="fa-solid fa-floppy-disk"></i> Save Company Profile</button>
      </form>

    </div></main>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => ProfilePage.initEmployer());
  </script>
</body>
</html>
