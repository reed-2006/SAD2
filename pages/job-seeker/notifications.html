<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="notifications" data-role="seeker">

  <header id="topbar"></header>

  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main-area"><div class="page-wrap">

      <div class="row-between">
        <h1 class="page-title">Notifications</h1>
        <button class="btn btn-outline btn-sm" id="mark-all"><i class="fa-solid fa-check-double"></i> Mark all read</button>
      </div>
      <p class="muted">Updates about your applications, saved jobs, and programs.</p>

      <div id="notif-list" class="mt-2"></div>

    </div></main>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireRole('seeker')) return;
      const user = getCurrentUser();

      const render = () => {
        const items = Notifications.forUser(user.id);
        document.getElementById('notif-list').innerHTML = items.length === 0
          ? UI.emptyState('fa-envelope-open', 'No notifications yet',
              'Apply to a job or enroll in a program to get updates here.')
          : items.map(n => `
            <div class="card notif-item ${n.read ? '' : 'unread'}" data-id="${n.id}" style="margin-bottom:8px">
              <div class="n-icon"><i class="fa-solid ${Notifications.TYPE_ICONS[n.type] || 'fa-bell'}"></i></div>
              <div class="n-body">
                <strong>${UI.esc(n.title)}</strong>
                <span>${UI.esc(n.message)}</span>
                <small>${UI.timeAgo(n.createdAt)} · type: ${UI.esc(n.type)}</small>
              </div>
              <button class="btn btn-ghost btn-sm js-del-notif" data-id="${n.id}" title="Delete">
                <i class="fa-solid fa-trash"></i></button>
            </div>`).join('');

        // clicking a notification marks it read; trash removes it
        document.querySelectorAll('.notif-item').forEach(el =>
          el.onclick = () => { Notifications.markRead(el.dataset.id); render(); });
        document.querySelectorAll('.js-del-notif').forEach(b =>
          b.onclick = e => {
            e.stopPropagation();
            Notifications.remove(b.dataset.id);
            UI.toast('Notification removed.');
            render();
          });
      };

      document.getElementById('mark-all').onclick = () => {
        Notifications.markAllRead(user.id);
        UI.toast('All notifications marked as read.', 'success');
        render();
      };

      render();
    });
  </script>
</body>
</html>
