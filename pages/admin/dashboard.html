<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — SkillBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="admin-dashboard" data-role="admin">

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <header id="topbar"></header>

  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main-area" id="main-content"><div class="page-wrap">

      <h1 class="page-title">Admin Dashboard</h1>
      <p class="muted">Everything happening on SkillBridge right now.</p>

      <!-- live counters -->
      <div class="grid-4 mt-2" id="admin-stats"></div>

      <div class="grid-2 mt-3">
        <!-- job approvals -->
        <div class="card">
          <div class="row-between">
            <h3><i class="fa-solid fa-hourglass-half"></i> Jobs Awaiting Approval</h3>
            <a class="btn btn-ghost btn-sm" href="jobs.html">All jobs →</a>
          </div>
          <div id="admin-pending-jobs"></div>
        </div>

        <!-- employer verifications -->
        <div class="card">
          <div class="row-between">
            <h3><i class="fa-solid fa-building-shield"></i> Employers to Verify</h3>
            <a class="btn btn-ghost btn-sm" href="employers.html">All employers →</a>
          </div>
          <div id="admin-pending-employers"></div>
        </div>
      </div>

    </div></main>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/applications.js"></script>
  <script src="../../assets/js/jobs.js"></script>
  <script src="../../assets/js/recommendations.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => AdminPage.initDashboard());
  </script>
</body>
</html>
