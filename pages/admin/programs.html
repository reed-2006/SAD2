<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Programs Catalog — SkillBridge Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="admin-programs" data-role="admin">

  <header id="topbar"></header>

  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main-area"><div class="page-wrap">

      <h1 class="page-title">Training & Livelihood Programs</h1>
      <p class="muted">Add or remove programs from the public catalog. Job seekers are notified of new entries.</p>

      <!-- create form -->
      <form id="program-form" class="card mt-2" novalidate>
        <h3><i class="fa-solid fa-plus"></i> Add a New Program</h3>
        <div class="form-grid-2 mt-1">
          <div class="form-group">
            <label>Type</label>
            <select id="prog-type">
              <option value="training">Skills Training / Seminar</option>
              <option value="livelihood">Livelihood / Assistance</option>
            </select>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="prog-category"><option>Skills Training</option><option>Seminar</option></select>
          </div>
          <div class="form-group form-span-2">
            <label>Program Title *</label>
            <input type="text" id="prog-title" placeholder="e.g. Basic Electrical Installation NC II">
          </div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="prog-desc" rows="2"
            placeholder="What will participants learn or receive?"></textarea>
        </div>
        <div class="form-grid-3">
          <div class="form-group">
            <label>Organizer</label>
            <input type="text" id="prog-organizer" placeholder="e.g. TESDA / PESO Toledo">
          </div>
          <div class="form-group">
            <label>Venue</label>
            <input type="text" id="prog-venue" placeholder="e.g. Toledo City Sports Complex">
          </div>
          <div class="form-group">
            <label>Schedule</label>
            <input type="text" id="prog-schedule" placeholder="e.g. Mon–Fri, 9AM–12NN">
          </div>
          <div class="form-group">
            <label>Duration</label>
            <input type="text" id="prog-duration" placeholder="e.g. 2 weeks">
          </div>
          <div class="form-group">
            <label>Slots</label>
            <input type="number" id="prog-slots" min="0" placeholder="e.g. 30">
          </div>
          <div class="form-group">
            <label>Beneficiary Note (optional)</label>
            <input type="text" id="prog-note" placeholder="e.g. Free starter kit for graduates">
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-2">
          <i class="fa-solid fa-circle-plus"></i> Add Program to Catalog</button>
      </form>

      <!-- current catalog -->
      <h2 class="mt-3">Current Catalog</h2>
      <div class="card mt-1" id="program-catalog-list"></div>

    </div></main>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/applications.js"></script>
  <script src="../../assets/js/jobs.js"></script>
  <script src="../../assets/js/recommendations.js"></script>
  <script src="../../assets/js/programs.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => AdminPage.initPrograms());
  </script>
</body>
</html>
