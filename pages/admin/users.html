<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users — SkillBridge Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>
<body data-page="admin-users" data-role="admin">

  <header id="topbar"></header>

  <div class="shell">
    <aside id="sidebar"></aside>

    <main class="main-area"><div class="page-wrap">

      <h1 class="page-title">Users</h1>
      <p class="muted">All job seeker and employer accounts. Deactivated users cannot log in.</p>

      <input type="text" id="user-search" class="mt-2"
             placeholder="🔍 Search by name or email…">

      <div id="users-list" class="mt-2"></div>

    </div></main>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>

  <script src="../../assets/js/storage.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/notifications.js"></script>
  <script src="../../assets/js/applications.js"></script>
  <script src="../../assets/js/jobs.js"></script>
  <script src="../../assets/js/recommendations.js"></script>
  <script src="../../assets/js/admin.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!AdminPage.requireAdmin()) return;
      document.getElementById('user-search').oninput =
        UI.debounce(() => AdminPage.renderUsers());
      AdminPage.renderUsers();
    });
  </script>
</body>
</html>
